# ============================================================================
# Gable — Slack app manifest
# ============================================================================
#
# HOW TO USE
#   1. Go to https://api.slack.com/apps?new_app=1
#   2. Choose "From an app manifest"
#   3. Pick the workspace
#   4. Switch the editor to YAML and paste this file
#   5. Create the app, then upload assets/gable-icon-512.png as the app icon
#   6. Basic Information -> App-Level Tokens -> Generate Token and Scopes
#        Name:  gable-socket
#        Scope: connections:write
#        -> this is SLACK_APP_TOKEN (starts with xapp-)
#   7. Install to Workspace
#        OAuth & Permissions -> Bot User OAuth Token
#        -> this is SLACK_BOT_TOKEN (starts with xoxb-)
#   8. Basic Information -> Signing Secret -> SLACK_SIGNING_SECRET
#   9. Invite the bot to the channel:  /invite @Gable  in C0BP597644B
#
# NOTE: Slack strips comments when it saves the manifest. That is expected —
# this file is the source of truth, the Slack UI is a rendering of it.
#
# NOTE: Slack's manifest schema changes over time. If a key below is rejected,
# remove that key rather than guessing at a replacement, and record what you
# removed in ARCHITECTURE.md's decision log.
# ============================================================================

display_information:
  name: Gable
  description: Turns listing form submissions into ready-to-polish Canva flyers.
  background_color: "#16222e"
  long_description: >-
    Gable watches the listing intake sheet, resolves a photo for each property,
    verifies the submitting agent's contact details against their brokerage
    site, matches the agent to their Canva template, and assembles a Bulk
    Create file ready to drop into Canva. It reports what it found and what it
    could not find, flags anything uncertain, and never marks a flyer ready
    while a required field is empty. Every flyer still passes through a human
    before it reaches a client — Gable removes the typing and the photo
    hunting, not the judgment.

features:
  bot_user:
    display_name: Gable
    always_online: true

  slash_commands:
    - command: /gable
      description: Check status, force a run, retry a listing, or list templates
      usage_hint: "status | run | retry <run_id> | templates | pause | resume"
      should_escape: false

oauth_config:
  scopes:
    bot:
      # Respond when someone writes "@Gable ..." in a channel.
      - app_mentions:read

      # Post listing cards, batch summaries, and error reports.
      - chat:write

      # Post to a channel the bot has not been explicitly invited to.
      # Remove this if you would rather always /invite the bot first.
      - chat:write.public

      # Required for the /gable slash command.
      - commands

      # Upload the Bulk Create .xlsx as a Slack file attachment.
      - files:write

      # Receive and reply to direct messages (message.im below needs im:history).
      - im:history
      - im:write

      # Acknowledge an action with a reaction instead of another message.
      - reactions:write

      # Resolve the display name of whoever clicked Approve, for the Runs log.
      - users:read

settings:
  event_subscriptions:
    # No request_url: Socket Mode delivers events over an outbound WebSocket.
    bot_events:
      - app_mention
      - message.im

  interactivity:
    # Block Kit buttons: Approve / Replace photo / Skip.
    # No request_url needed under Socket Mode.
    is_enabled: true

  # Socket Mode is deliberate. It means no inbound ports, no TLS certificate,
  # and no domain name on the $4 droplet. See ARCHITECTURE.md section 2.2 for
  # the tradeoff it creates (the Sheet must be polled, not webhooked).
  socket_mode_enabled: true

  org_deploy_enabled: false
  token_rotation_enabled: false
